name: OncoFusion CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Detect initialized source tree
        id: source
        run: |
          if test -f pyproject.toml; then echo 'ready=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.source.outputs.ready == 'true'
        with:
          python-version: ${{ matrix.python }}
      - name: Install backend and test dependencies
        if: steps.source.outputs.ready == 'true'
        run: python -m pip install -e '.[dev]'
      - name: Unit and integration tests
        if: steps.source.outputs.ready == 'true'
        run: python scripts/run_checks.py
      - name: Real loopback HTTP integration
        if: steps.source.outputs.ready == 'true'
        run: python scripts/http_smoke.py
      - name: Exhaustive offline scenarios
        if: steps.source.outputs.ready == 'true' && matrix.python == '3.12'
        run: python scripts/stress_offline.py
      - uses: actions/upload-artifact@v4
        if: always() && steps.source.outputs.ready == 'true'
        with:
          name: checks-python-${{ matrix.python }}
          path: |
            results/checks/
            results/http_smoke.json
            results/stress.json

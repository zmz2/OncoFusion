name: OncoFusion CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ONCOFUSION_PROVIDER: mock
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Archive tracked source for reproducibility
        if: matrix.python == '3.12'
        run: |
          mkdir -p results/source
          git archive --format=tar.gz --output=results/source/oncofusion-source.tar.gz HEAD
          git rev-parse HEAD > results/source/commit.txt
          sha256sum results/source/oncofusion-source.tar.gz > results/source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: oncofusion-verified-source
          path: results/source/
          retention-days: 14
      - name: Install backend and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Unit and integration tests
        run: |
          python scripts/run_checks.py
          python scripts/check_v1.py --backend native --out results/checks/v1.json
          python -c "from oncofusion.profiles import available_backend, v1_class_config; assert available_backend() == 'native'; assert v1_class_config().workflow_backend == 'native'"
          python -m pytest tests/test_demo_app.py -q
      - name: Real loopback HTTP integration
        run: python scripts/http_smoke.py
      - name: Exhaustive offline scenarios
        if: matrix.python == '3.12'
        run: python scripts/stress_offline.py
      - name: Build distributable wheel
        if: matrix.python == '3.12'
        run: python -m pip wheel --no-deps --wheel-dir results/wheels .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-python-${{ matrix.python }}
          path: |
            results/checks/
            results/http_smoke.json
            results/stress.json
            results/wheels/
          retention-days: 14

  graph-contract:
    name: LangGraph workflow contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ONCOFUSION_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install with the graph extra
        run: python -m pip install -e '.[dev,graph]'
      - name: Graph workflow and classroom protocol contract
        run: |
          python -m pytest tests/test_upstream_workflow.py tests/test_demo_app.py tests/test_v1_fast.py -q
          python scripts/check_v1.py --backend langgraph --out results/checks/v1-graph.json
          python -c "from oncofusion.profiles import available_backend, v1_class_config; assert available_backend() == 'langgraph'; assert v1_class_config().workflow_backend == 'langgraph'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-graph-contract
          path: results/checks/
          retention-days: 14

name: Apply verified backend validation
on:
  push:
    branches: [codex/backend-validation-20261017]
    paths: ['.github/workflows/apply-validation.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/backend-validation-20261017
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify patch and apply ordinary source changes
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          p = Path('.delivery/phase2.b64')
          payload = base64.b64decode(p.read_text().strip(), validate=True)
          assert hashlib.sha256(payload).hexdigest() == '0f47b02db80cddf172bed2f688e929d42cd6b31ec4c340adce27f2f78ca1a3e6'
          patch = lzma.decompress(payload)
          subprocess.run(['git','apply','--check','-'], input=patch, check=True)
          subprocess.run(['git','apply','--index','-'], input=patch, check=True)
          p.unlink()
          PY
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - name: Commit materialized source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add oncofusion scripts tests docs README.md TASK.md .delivery
          git commit -m 'feat: idempotent browser jobs, resumable SSE and complete usage audits'
          git push origin HEAD:codex/backend-validation-20261017

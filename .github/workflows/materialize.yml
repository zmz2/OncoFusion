name: Materialize verified source
on:
  push:
    paths: ['.github/workflows/materialize.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify and unpack source
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, shutil, tarfile
          from pathlib import Path, PurePosixPath
          parts = sorted(Path('.bootstrap').glob('*.b64'))
          assert [p.name for p in parts] == [f'{i:02}.b64' for i in range(11)]
          text = ''.join(p.read_text().strip() for p in parts)
          # Correct the identified two-character transcription duplication in part 05.
          text = text.replace('HUG2G2G37', 'HUG2G37')
          data = base64.b64decode(text, validate=True)
          assert hashlib.sha256(data).hexdigest() == 'd1f6c214f4f0016b4e20dbc6cfae50849e1c7f58e5c8f73ee9219ceecaf98981'
          roots = {'oncofusion', 'scripts', 'tests', 'experiments', 'docs', 'verification'}
          files = {'.dockerignore', '.env.example', '.gitignore', 'AGENTS.md', 'Dockerfile', 'Makefile', 'README.md', 'TASK.md', 'constraints-tested.txt', 'pyproject.toml'}
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:xz') as archive:
              members = archive.getmembers()
              assert len(members) == 67 and sum(m.size for m in members) == 345165
              for member in members:
                  p = PurePosixPath(member.name)
                  assert member.isfile() and not p.is_absolute() and '..' not in p.parts
                  assert member.name in files or p.parts[0] in roots
                  target = Path(member.name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.extractfile(member).read())
          manifest = json.loads(Path('verification/source_manifest.json').read_text())
          for filename, expected in manifest.items():
              assert hashlib.sha256(Path(filename).read_bytes()).hexdigest() == expected, filename
          shutil.rmtree('.bootstrap')
          print(f'Verified and materialized {len(members)} source files')
          PY
      - name: Commit ordinary source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all . ':!.github'
          git commit -m 'feat: implement tested OncoFusion backend, experiments and Codex handover'
          git push origin HEAD:main

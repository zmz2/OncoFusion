name: Apply reviewed first-version fixes
on:
  push:
    branches: [codex/v1-project-review-20261017]
    paths: ['.github/workflows/apply-v1-review.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v1-project-review-20261017
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify uniform-budget patch
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          path = Path('.delivery/v1-budget.b64')
          data = base64.b64decode(path.read_text().strip(), validate=True)
          assert hashlib.sha256(data).hexdigest() == '5fa4a73325cdf4b35e410de658e441ca31ce176f82ac7054b60c965ca94356e0'
          patch = lzma.decompress(data)
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          path.unlink()
          PY
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/run_checks.py
      - name: Commit ordinary verified configuration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all . ':!.github'
          git commit -m 'fix: use uniformly calibrated v1 development budget and record coverage limits'
          git push origin HEAD:codex/v1-project-review-20261017

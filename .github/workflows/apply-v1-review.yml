name: Apply reviewed first-version fixes
on:
  push:
    branches: [codex/v1-project-review-20261017]
    paths: ['.github/workflows/apply-v1-review.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ONCOFUSION_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v1-project-review-20261017
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify followup patch and apply source
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          path = Path('.delivery/v1-followup.b64')
          payload = base64.b64decode(path.read_text().strip(), validate=True)
          assert hashlib.sha256(payload).hexdigest() == '1b60fe10fcd0d2f289300d36ec4223aeae4105dba881bf46e9a04ebf7f293c14'
          patch = lzma.decompress(payload)
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          path.unlink()
          PY
      - name: Run core regression
        run: |
          python -m pip install -e '.[dev]'
          python scripts/run_checks.py
          python scripts/http_smoke.py
      - name: Preserve executed checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: applied-v1-checks
          path: |
            results/checks/
            results/http_smoke.json
          retention-days: 14
      - name: Commit ordinary reviewed source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all . ':!.github'
          git commit -m 'fix: native CIViC claim fields and isolated clinical dependency ABI'
          git push origin HEAD:codex/v1-project-review-20261017

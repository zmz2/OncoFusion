name: Apply verified v1 risk review
on:
  push:
    branches: [codex/v1-risk-review]
    paths: ['.github/workflows/apply-v1.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ONCOFUSION_PROVIDER: mock
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v1-risk-review
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify compressed patch and every source preimage
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, re, subprocess
          from pathlib import Path, PurePosixPath
          parts = [Path(f'.delivery/v1-{i}.b64') for i in range(7)]
          data = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          assert len(data) == 29424
          assert hashlib.sha256(data).hexdigest() == 'bd2d1be780b38800063f5a4463fd36437626703327bab89d637bb79b2be3f854'
          patch = lzma.decompress(data)
          allowed_roots = {'oncofusion', 'scripts', 'tests', 'experiments', 'docs', 'verification'}
          allowed_files = {'README.md', 'TASK.md', 'upstream_manifest.json'}
          paths = []
          for block in patch.decode().split('diff --git ')[1:]:
              header = block.splitlines()[0]
              match = re.fullmatch(r'a/(\S+) b/(\S+)', header)
              assert match and match[1] == match[2], header
              path = match[1]
              p = PurePosixPath(path)
              assert not p.is_absolute() and '..' not in p.parts
              assert path in allowed_files or p.parts[0] in allowed_roots, path
              old = re.search(r'^index ([0-9a-f]+)\.\.[0-9a-f]+', block, re.M)[1]
              if set(old) == {'0'}:
                  assert not Path(path).exists(), path
              else:
                  actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
                  assert actual.startswith(old), (path, old, actual)
              paths.append(path)
          assert len(paths) == len(set(paths)) == 34, len(paths)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--index', '-'], input=patch, check=True)
          print(f'Applied {len(paths)} checksum-verified ordinary source changes')
          PY
      - name: Install actual graph and biomedical dependencies
        run: python -m pip install -e '.[dev,graph,biomedical]'
      - name: Run complete regression and v1 contracts
        run: |
          python scripts/run_checks.py
          python scripts/check_v1.py --out results/v1/checks.json
          python scripts/check_upstream.py --out results/v1/upstream.json
          python scripts/http_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: applied-v1-checks
          path: |
            results/checks/
            results/v1/
            results/http_smoke.json
          retention-days: 14
      - name: Commit tested ordinary source and remove delivery payload
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .delivery/v1-*.b64
          git add oncofusion scripts tests experiments docs verification README.md TASK.md upstream_manifest.json .delivery
          git commit -m 'fix: align conservative v1 scope, evidence retrieval, evaluation and inference boundaries'
          git push origin HEAD:codex/v1-risk-review

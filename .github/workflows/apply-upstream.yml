name: Apply reviewed upstream integration
on:
  push:
    branches: [codex/upstream-agents-20261017]
    paths: ['.github/workflows/apply-upstream.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ONCOFUSION_PROVIDER: mock
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/upstream-agents-20261017
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify audit patch and apply source
        run: |
          python - <<'PY'
          import base64,hashlib,lzma,subprocess
          from pathlib import Path
          path=Path('.delivery/upstream-docs.b64')
          data=base64.b64decode(path.read_text().strip(),validate=True)
          assert hashlib.sha256(data).hexdigest()=='156c212a07fda131035f96aa32e60f6700151fd49d6c00b3d8d9a7d8ee6eb6ec'
          patch=lzma.decompress(data)
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          path.unlink()
          PY
      - name: Install genuine runtime packages and execute tests
        run: |
          python -m pip install -e '.[dev,graph,biomedical]'
          python scripts/run_checks.py
          python scripts/check_upstream.py --out results/upstream/checks.json
          python scripts/http_smoke.py
      - name: Retain regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: applied-upstream-checks
          path: |
            results/checks/
            results/upstream/
            results/http_smoke.json
          retention-days: 14
      - name: Commit reviewed source and handover
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all . ':!.github'
          git commit -m 'docs: record mature-agent reuse audit, paired studies and Codex handover'
          git push origin HEAD:codex/upstream-agents-20261017

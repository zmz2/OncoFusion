name: Apply verified upstream integration
on:
  push:
    branches: [codex/upstream-agent-integration-20261017]
    paths: ['.github/workflows/apply-upstream.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/upstream-agent-integration-20261017
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source integrity and apply patch
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          parts = sorted(Path('.delivery').glob('upstream-*.b64'))
          assert [p.name for p in parts] == [f'upstream-{i:02}.b64' for i in range(6)]
          data = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          actual = hashlib.sha256(data).hexdigest()
          assert actual == '8dfd85637bb0c0b54c04b3d25e46c2d1fa1a2c69f5718ba5a3f0e3d88aa46456', actual
          patch = lzma.decompress(data)
          assert len(patch) == 127819
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          for path in parts:
              path.unlink()
          PY
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
        env:
          ONCOFUSION_PROVIDER: mock
      - name: Commit verified ordinary source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all . ':!.github'
          git commit -m 'feat: integrate upstream-backed evidence-first oncology agents and workflow'
          git push origin HEAD:codex/upstream-agent-integration-20261017

name: Upstream implementation audit
on:
  push:
    branches: [codex/upstream-agent-integration-20261017]
    paths: ['.github/workflows/upstream-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtimes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip download 'langgraph==1.0.10' --dest wheels
      - uses: actions/upload-artifact@v4
        with:
          name: graph-python313-wheels
          path: wheels/
          retention-days: 7

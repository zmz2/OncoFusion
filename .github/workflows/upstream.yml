name: Upstream integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [clinical, biomedical]
    env:
      ONCOFUSION_PROVIDER: mock
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      LOGURU_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated actual upstream dependencies
        run: |
          python -m pip install -e '.[dev,graph,${{ matrix.profile }}]'
          python -m pip check
      - name: Record tested environment
        run: |
          mkdir -p results/upstream
          python -m pip freeze > results/upstream/environment.txt
      - name: Require actual clinical import
        if: matrix.profile == 'clinical'
        run: python -c "import medspacy, numpy; assert medspacy.__version__ == '1.3.1'; assert numpy.__version__ == '1.26.4'"
      - name: Test backend with actual graph and selected component
        run: |
          python scripts/run_checks.py
          python scripts/http_smoke.py
      - name: Validate actual biomedical SDK schemas
        if: matrix.profile == 'biomedical'
        run: python scripts/check_upstream.py --out results/upstream/checks.json
      - name: Exercise recommended v1 on authentic inputs
        if: matrix.profile == 'clinical'
        run: |
          python scripts/public_data_checks.py --accept-source-terms --clinical-graph \
            --datasets mtbbench civicfact --out results/upstream/v1_data.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-checks-${{ matrix.profile }}
          path: |
            results/checks/
            results/upstream/
            results/http_smoke.json
          retention-days: 14

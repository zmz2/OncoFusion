name: Verify final v1 budget fix
on:
  push:
    branches: [codex/v1-risk-review]
    paths: ['.github/workflows/apply-v1-final.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ONCOFUSION_PROVIDER: mock
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v1-risk-review
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify payload and source preimages
        run: |
          python - <<'PY'
          import base64,hashlib,lzma,re,subprocess
          from pathlib import Path
          data=base64.b64decode(Path('.delivery/v1-final.b64').read_text().strip(),validate=True)
          assert len(data)==3384
          assert hashlib.sha256(data).hexdigest()=='089cc5c14ec3ffb45958b4f82908e4fda8bf3b3fa21601c3b674cc456f7f4f2f'
          patch=lzma.decompress(data)
          expected={'TASK.md','docs/V1_REVIEW.md','oncofusion/profiles.py','tests/test_v1_contract.py',
                    'experiments/v1_mtb_smoke.json','experiments/v1_civic_smoke.json',
                    'experiments/v1_mtb_ablations.json','experiments/v1_civic_ablations.json'}
          seen=set()
          for block in patch.decode().split('diff --git ')[1:]:
              m=re.fullmatch(r'a/(\S+) b/(\S+)',block.splitlines()[0])
              assert m and m[1]==m[2] and m[1] in expected
              old=re.search(r'^index ([0-9a-f]+)\.\.[0-9a-f]+',block,re.M)[1]
              actual=subprocess.check_output(['git','hash-object',m[1]],text=True).strip()
              assert actual.startswith(old),(m[1],old,actual)
              seen.add(m[1])
          assert seen==expected
          subprocess.run(['git','apply','--unidiff-zero','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--unidiff-zero','--index','-'],input=patch,check=True)
          PY
      - run: python -m pip install -e '.[dev,graph,biomedical]'
      - name: Complete v1 and upstream regression
        run: |
          python scripts/run_checks.py
          python scripts/check_v1.py --out results/v1/contracts.json
          python scripts/check_upstream.py --out results/v1/upstream.json
          python scripts/public_data_checks.py --accept-source-terms --out results/v1/public_data.json
          python scripts/http_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-v1-acceptance
          path: |
            results/checks/
            results/v1/
            results/http_smoke.json
          retention-days: 14
      - name: Commit verified ordinary changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .delivery/v1-final.b64
          git add TASK.md docs/V1_REVIEW.md oncofusion/profiles.py tests/test_v1_contract.py experiments/v1_*.json .delivery
          git commit -m 'fix: give all conservative v1 controls equal verified long-input budget headroom'
          git push origin HEAD:codex/v1-risk-review

<style>
:root{--blue:#245fd4;--ink:#182b48;--muted:#61738d;--line:#e2e9f3;--light:#f3f7fd;--green:#16725b;--amber:#a56416}
*{box-sizing:border-box}body{margin:0;background:#f8fafd;color:var(--ink);font:19px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}header{height:104px;padding:24px 48px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:31px;letter-spacing:-.5px}h1 span{font-weight:400;color:var(--muted);font-size:21px;margin-left:20px}.brand-mark{display:inline-grid;place-items:center;background:var(--blue);color:white;border-radius:12px;width:43px;height:43px;margin-right:13px;font-size:25px}.model{font-size:19px;color:var(--muted)}.model b{color:var(--ink)}main{display:grid;grid-template-columns:290px 1fr;gap:30px;max-width:1920px;margin:auto;padding:28px 40px}.rail{background:white;border:1px solid var(--line);border-radius:16px;padding:26px 22px;align-self:start;position:sticky;top:20px}.eyebrow{font-size:15px;letter-spacing:2px;color:var(--blue);font-weight:650}.rail h2{font-size:24px;margin:4px 0 23px}.rail label{display:block;font-size:15px;color:var(--muted);margin:16px 0 7px}select{width:100%;border:1px solid #cfdaeb;border-radius:9px;padding:10px;color:var(--ink);background:white;font-size:17px}.primary,.secondary{border-radius:9px;padding:11px 14px;width:100%;margin-top:16px;border:1px solid var(--blue);background:var(--blue);color:white;font-size:18px;font-weight:600}.secondary{background:white;color:var(--blue);border-color:#d2dded;font-weight:500;margin-top:10px}.note{font-size:14px;color:var(--muted);line-height:1.6}.rail hr{border:0;border-top:1px solid var(--line);margin:24px 0}.check{display:flex!important;align-items:center;gap:8px;font-size:15px!important}.check input{width:18px;height:18px;accent-color:var(--blue)}.workspace{min-width:0}.topline{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:0 0 20px}.topline h2{font-size:30px;margin:0}.chips{display:flex;gap:9px;flex-wrap:wrap}.chip{font-size:14px;border-radius:6px;padding:5px 10px;background:#eaf1fc;color:var(--blue)}.chip.green{background:#e6f4ef;color:var(--green)}.chip.amber{background:#fff2df;color:var(--amber)}.steps{display:flex;gap:9px;margin-bottom:24px}.steps button{flex:1;text-align:left;border:1px solid var(--line);border-radius:10px;background:white;color:var(--muted);padding:12px 17px;font-size:17px}.steps b{color:var(--blue);font-size:14px;display:block;margin-bottom:2px}.steps button.active{background:var(--blue);border-color:var(--blue);color:#fff}.steps button.active b{color:#c9dcff}.panel{display:none}.panel.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:20px}.card h3{font-size:23px;margin:0 0 14px}.question{font-size:26px;font-weight:600;line-height:1.5;max-width:1050px}.subtle{color:var(--muted);font-size:17px}.two{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.roles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.role{padding:22px;border:1px solid var(--line);border-radius:12px;background:white;min-height:216px}.role-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.role h4{font-size:22px;margin:0}.state{font-size:13px;color:var(--muted)}.choice{font-size:38px;color:var(--blue);font-weight:650;line-height:1.1;margin-bottom:15px}.reason{font-size:18px;line-height:1.6;white-space:pre-wrap}.small{font-size:14px;color:var(--muted)}.refs-button{color:var(--blue);text-decoration:none;display:inline-block;margin-top:12px;font-size:15px;border:0;background:none;padding:0}.row{display:flex;gap:22px;align-items:center;justify-content:space-between}.answer{font-size:64px;font-weight:700;line-height:1.2;color:var(--blue)}.vote-line{display:flex;align-items:center;gap:15px;margin:15px 0}.vote-label{width:75px;font-size:20px}.bar{flex:1;background:#edf2fa;border-radius:8px;height:18px;overflow:hidden}.bar i{height:100%;display:block;background:var(--blue);border-radius:8px}.vote-n{width:70px;font-size:21px;font-weight:650}.arb-status{font-size:24px;font-weight:650;margin:10px 0}.arb-change{display:flex;gap:25px;align-items:center;font-size:32px;font-weight:650;margin:20px 0;color:var(--blue)}.divider{color:#a8b7cc;font-size:26px}.reference{padding:16px 18px;background:var(--light);border-left:3px solid #9bb7e9;border-radius:5px;margin:12px 0;font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere}details{margin-top:12px}summary{cursor:pointer;color:var(--blue);font-size:16px}pre{font:14px/1.6 ui-monospace,monospace;overflow:auto;white-space:pre-wrap;max-height:370px;background:var(--light);padding:18px;border-radius:8px}blockquote{white-space:pre-wrap;margin:15px 0;background:var(--light);padding:20px;border-left:3px solid #abc0e8;font-size:17px;max-height:390px;overflow:auto}.source-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:18px 0}.source{padding:14px 18px;border-radius:9px;background:var(--light);font-size:17px}.source strong{display:block}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7e96b7;margin-right:8px}.status-dot.running{background:var(--blue);animation:pulse 1.5s infinite}.toast{margin-top:12px;font-size:15px;color:var(--amber);white-space:pre-wrap}.audit{margin-top:20px;font-size:15px;color:var(--muted)}.audit-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:20px}.audit-grid b{display:block;font-size:24px;color:var(--ink)}.empty{padding:35px 0;color:var(--muted);font-size:22px}.mini-heading{margin:23px 0 15px;font-size:20px;font-weight:650}.limit{font-size:14px;color:var(--muted);margin-top:20px}.result-reasons{max-width:1100px;font-size:21px}.detail-roles .role{min-height:390px}.original-label{font-size:14px;font-weight:500;color:var(--muted);margin-top:18px}.runtime-status{font-size:15px;color:var(--muted)}a{color:var(--blue)}@keyframes pulse{50%{opacity:.3}}@media(max-width:1200px){main{grid-template-columns:235px 1fr;padding:20px;gap:20px}.roles{grid-template-columns:repeat(2,1fr)}header{padding:20px}h1 span{display:none}.two{grid-template-columns:1fr}.question{font-size:23px}}@media(max-width:760px){main{display:block}.rail{position:static;margin-bottom:20px}.steps{flex-wrap:wrap}.steps button{min-width:100px}.roles{grid-template-columns:1fr}.source-grid{grid-template-columns:1fr}.topline{display:block}.model{display:none}}
#overview-roles .reason{font-size:17px;line-height:1.5}#overview-roles .role{padding:18px;min-height:230px}#overview-result h3{font-size:20px;margin-bottom:7px}#overview-result .answer{font-size:52px}#overview-result .arb-status{font-size:21px}#overview-result p{margin:8px 0;font-size:16px}dialog{width:min(1120px,90vw);max-height:82vh;border:1px solid var(--line);border-radius:16px;padding:28px;color:var(--ink)}dialog::backdrop{background:#172a425c}</style></head>
<body>
<header><h1><span class="brand-mark">O</span>OncoFusion<span>专业判断 · 等权投票 · 原文核验</span></h1><div class="model">同一模型 <b>千问 3.6 35B-A3B</b></div></header>
<main>
<aside class="rail">
<div class="eyebrow">CLASSROOM DEMO / V2</div><h2>从证据到答案</h2>
<label for="case-select">内置案例</label><select id="case-select"></select>
<label for="source-select">记录版本</label><select id="source-select"><option value="historical">历史真实回放</option><option value="new">本轮真实运行</option></select>
<label for="system-select">系统</label><select id="system-select"><option value="OncoFusion">OncoFusion · 专业投票</option><option value="B0">B0 · 单Agent</option></select>
<button class="primary" id="start-run">发起真实运行</button>
<button class="secondary" id="reload-record">刷新记录</button>
<div class="toast" id="message" role="status"></div>
<hr><label class="check"><input type="checkbox" id="private-view">查看服务器原始资料</label>
<p class="note" id="privacy-note">当前为脱敏投屏视图。中文概述与原文分别标注，公开省略不补写成原文。</p>
<button class="secondary" id="upload-button">上传 JSON / JSONL</button><input type="file" accept=".json,.jsonl" id="upload" hidden>
<p class="note">本轮固定三例、两系统各一次。重复点击与刷新查询原任务，不重复消耗调用。</p>
<div class="runtime-status" id="runtime-status"></div>
</aside>
<div class="workspace">
<div class="topline"><h2 id="case-title">正在读取真实记录</h2><div class="chips" id="badges"></div></div>
<nav class="steps" aria-label="方法步骤">
<button class="active" data-view="overview"><b>OVERVIEW</b>方法总览</button>
<button data-view="input"><b>01 INPUT</b>输入与原文</button>
<button data-view="experts"><b>02 SPECIALISTS</b>专业判断</button>
<button data-view="vote"><b>03–04 VOTE & VERIFY</b>投票与仲裁</button>
<button data-view="result"><b>05 OUTPUT</b>答案与引用</button>
</nav>
<section class="panel active" id="panel-overview"><div class="card" id="overview-question"></div><div class="roles" id="overview-roles"></div><div class="two" style="margin-top:20px"><div class="card" id="overview-vote"></div><div class="card" id="overview-result"></div></div></section>
<section class="panel" id="panel-input"><div class="card" id="input-content"></div></section>
<section class="panel" id="panel-experts"><div class="card"><h3>各自读证据，独立回答同一道题</h3><div class="subtle">所有参与角色收到同一问题与同一证据包，彼此看不到选票。</div></div><div class="roles detail-roles" id="detail-roles"></div></section>
<section class="panel" id="panel-vote"><div class="two"><div class="card" id="vote-content"></div><div class="card" id="arbitration-content"></div></div><div class="card" id="arbitration-refs"></div></section>
<section class="panel" id="panel-result"><div class="card" id="result-content"></div><div class="card" id="result-refs"></div></section>
<details class="audit" id="audit"><summary>展开技术审计：调用、token、耗时与运行身份</summary><div id="audit-content"></div></details>
<p class="limit">三例用于课堂链路展示；历史 MTB43 开发集成绩保持原记录，不被本轮新运行替换。</p>
</div></main><dialog id="citation-dialog"><div class="row"><h3 id="citation-title">专业引用</h3><button id="close-citations" class="secondary" style="width:auto;margin:0">关闭</button></div><div id="citation-body"></div></dialog>
<script>
"use strict";
const $=id=>document.getElementById(id), esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const roleNames={literature:"文献",timeline:"时间线",genomics:"基因",pathology:"病理与语境",drug:"药物",generalist:"单Agent"};
const kinds={clinical:"临床与时间线",genomics:"分子检测",pathology:"病理与标本",therapy:"治疗资料",literature:"文献资料"};
const done=new Set(["succeeded","failed","interrupted","cancelled","budget_exhausted"]);
let catalog=null,record=null,input=null,events=new Map(),epoch=0,view="overview",timer=null,uploaded=false;
function message(text){$("message").textContent=text||"";}
async function api(path,options){const response=await fetch("/v1"+path,options);const body=await response.json();if(!response.ok)throw Error(typeof body.detail==="string"?body.detail:JSON.stringify(body.detail));return body;}
function answer(label){return label ? esc(label)+" · "+esc((input?.options||{})[label]==="Yes"?"是":(input?.options||{})[label]==="No"?"否":(input?.options||{})[label]||"") : "—";}
function tab(name){view=name;document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===name));document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id==="panel-"+name));}
function eventList(){return Array.from(events.values()).sort((a,b)=>a.sequence-b.sequence);}
function ballots(){if(record?.ballots?.length)return record.ballots;const map=new Map();eventList().forEach(e=>{if(e.details.ballot)map.set(e.details.ballot.role,e.details.ballot);});return Array.from(map.values());}
function planned(){const start=eventList().find(e=>e.kind==="run_started");return record?.vote?.planned_roles||start?.details?.planned_roles||[];}
function roleState(role){const list=eventList().filter(e=>e.role===role||(role==="generalist"&&e.role.startsWith("generalist")));if(list.some(e=>e.kind==="vote_member_failed"))return "未完成";if(list.some(e=>e.kind==="vote_member_completed"))return "已完成";return list.some(e=>e.kind==="agent_started")?"分析中":"等待调用";}
function roleCards(detail){let bs=ballots(),roles=planned();if(!roles.length)return '<div class="empty">任务开始后，由后端确定本例适用角色。</div>';return roles.map(name=>{const role=name.startsWith("generalist")?"generalist":name,b=bs.find(x=>x.role===role),status=b?.status==="failed"?"有限修复后失败":b?.status==="abstain"?"弃权":b?"已完成":roleState(name);let reason=b?.summary_zh||(record?.private?b?.brief_reason:null);return '<article class="role"><div class="role-head"><h4>'+esc(roleNames[role]||role)+'</h4><span class="state">'+esc(status)+'</span></div><div class="choice">'+(b?.label?answer(b.label):b?.status==="abstain"?"弃权":"—")+'</div><div class="reason">'+esc(reason||(b?.status==="failed"?"有限修复后未产生有效回答；失败记录已保留。":b?.status==="abstain"?"本角色弃权，不参与标签计票。":(b&&record?.private===false)?"中文摘要待审核；完整英文输出保留在服务器。":"等待本角色真实输出"))+'</div>'+(b?.evidence_ids?.length?'<button class="refs-button" data-role-ref="'+esc(role)+'">查看 '+b.evidence_ids.length+' 个引用入口 →</button>':"")+(detail&&b?'<div class="small" style="margin-top:16px">置信度（模型自报）：'+esc(b.confidence??"未提供")+' · 不参与加权</div><details><summary>英文原始输出</summary><blockquote>'+esc(b.brief_reason||"公开版省略；在服务器原始视图查看。")+'</blockquote></details><details><summary>引用编号</summary><pre>'+esc((b.evidence_ids||[]).join("\n"))+'</pre></details>':"")+'</article>';}).join("");}
function voteHTML(){const v=record?.vote,bs=ballots().filter(b=>b.status==="vote"),counts=v?.counts||bs.reduce((m,b)=>(m[b.label]=(m[b.label]||0)+1,m),{});let html='<h3>每位专家一票，程序等权计数</h3>';Object.keys(input?.options||{}).forEach(label=>{const n=counts[label]||0,total=v?.valid_votes||bs.length;html+='<div class="vote-line"><span class="vote-label">'+answer(label)+'</span><div class="bar"><i style="width:'+(total?100*n/total:0)+'%"></i></div><span class="vote-n">'+n+' 票</span></div>';});if(v)html+='<div class="subtle">有效票 '+v.valid_votes+' / '+v.planned_votes+' · '+(v.tied?"存在平票，按固定规则形成初始标签":"无平票")+'</div><div class="small">最高票占比 '+((v.top_share||0)*100).toFixed(0)+'% · 票差占比 '+((v.margin||0)*100).toFixed(0)+'%</div>';else html+='<div class="subtle">已返回 '+bs.length+' 张有效票；等待本轮收齐与计票。</div>';return html;}
function arbHTML(){
 const a=record?.vote?.arbitration,c=record?.config||catalog?.configs?.OncoFusion||{};
 let html='<h3>选择性仲裁 · Verifier</h3>';
 if(record?.system==="B0")return html+'<div class="arb-status">单Agent直接作答</div><p class="subtle">本对照不生成多专家选票。</p>';
 if(record?.vote?.completion_status==="failed")return html+'<div class="arb-status">有效选票不足</div><p class="subtle">未进入语义仲裁；本次执行失败保留。</p>';
 const started=eventList().some(e=>e.kind==="vote_arbitration_started");
 if(!a)return html+'<div class="arb-status">'+(started?'共识不足，正在核对原文':'等待独立选票')+'</div><p class="subtle">'+(started?'后端已发出真实仲裁调用。':'收齐选票后，由后端判断是否触发仲裁。')+'</p>';
 const threshold='<div class="small">触发条件：最高票占比 &lt; '+c.vote_arbitration_min_share+'，或票差占比 &lt; '+c.vote_arbitration_margin+'。</div>';
 if(!a.triggered)return html+'<div class="arb-status">共识充分，直接输出</div><p class="subtle">本例两个指标均达到阈值，没有额外仲裁调用。</p>'+threshold;
 html+='<span class="chip amber">已触发原文核验</span><div class="arb-change">'+esc(a.initial_label||"—")+'<span class="divider">→</span>'+esc(a.final_label||"—")+'</div><div class="small">初始票决 → 仲裁后标签</div><p class="subtle">'+esc(a.status==="failed"?'仲裁未完成，保留初始票决。':a.explanation||'仲裁已完成；说明保存在原始记录。')+'</p>';
 if(record?.gold)html+='<div class="small">评测侧比较：'+(a.initial_label===a.final_label?'标签未改变':a.initial_label!==record.gold&&a.final_label===record.gold?'本例由错误标签改为参考标签':a.initial_label===record.gold&&a.final_label!==record.gold?'本例改离参考标签':'标签改变，详见参考答案')+'</div>';
 return html+threshold;
}
function arbOverviewHTML(){const a=record?.vote?.arbitration;if(record?.system==="B0")return '<h3>单Agent作答</h3><div class="subtle">无多专家投票与仲裁。</div>';if(!a)return '<h3>选择性仲裁</h3><div class="subtle">等待后端判断是否触发。</div>';if(record.vote.completion_status==="failed")return '<h3>有效选票不足</h3><div class="subtle">执行失败已保留。</div>';if(!a.triggered)return '<h3>共识充分，直接输出</h3><div class="subtle">无额外仲裁调用。</div>';return '<h3>Verifier · 已触发原文核验</h3><div class="arb-change">'+esc(a.initial_label||"—")+'<span class="divider">→</span>'+esc(a.final_label||"—")+'</div><div class="small">初始票决 → 仲裁后标签 · 详细依据见“投票与仲裁”</div>';}
function refsHTML(citations){if(!citations?.length)return '<div class="subtle">暂无已记录引用。</div>';return citations.map((c,i)=>'<details '+(i<2?"open":"")+'><summary>来源 '+esc(c.document_id)+' · 字符 '+c.start+'–'+c.end+'</summary><div class="reference">'+esc(c.quote||c.redaction||"公开版原文已省略，原始位置保留在服务器。")+'</div></details>').join("");}
function resultHTML(compact){const d=record?.decision;if(!d)return '<h3>最终答案</h3><div class="empty">'+(done.has(record?.status)?"本次执行未产生有效最终答案。":"等待实际运行结果")+'</div>';let html='<div class="row"><div><h3>最终答案</h3><div class="answer">'+answer(d.answer)+'</div></div>'+(record.gold?'<div class="subtle">评测参考 '+answer(record.gold)+'<br><span class="chip '+(d.answer===record.gold?"green":"amber")+'">'+(d.answer===record.gold?"与参考标签一致":"与参考标签不一致")+'</span></div>':"")+'</div>';if(!compact)html+='<p class="result-reasons">'+esc(d.explanation)+'</p><div class="small">答案先由程序固定，解释与引用随后组装；Decision没有额外模型调用。</div>';return html;}
function inputHTML(){if(!input)return "";let html='<h3>问题与允许输入</h3><div class="question">'+esc(input.question_zh)+'</div><div class="original-label">原始问题 / ORIGINAL QUESTION</div><blockquote>'+esc(input.question_original||input.redaction||"公开版省略原始问题。")+'</blockquote><div class="chips">'+Object.entries(input.options||{}).map(([k,v])=>'<span class="chip">'+esc(k)+' · '+esc(v)+'</span>').join("")+'</div><div class="source-grid">'+(input.source_groups||[]).map(s=>'<div class="source"><strong>'+esc(kinds[s.kind]||s.kind)+'</strong>'+s.documents+' 份资料</div>').join("")+'</div><div class="small">'+esc(input.cutoff_label||"上传资料的阶段可见性由原协议检查")+' · 原文与中文转述分别标注</div><h3 style="margin-top:25px">关键来源（默认展开）</h3>';html+=(input.excerpts||[]).map(c=>'<details open><summary>'+esc(c.document_id)+' · '+c.start+'–'+c.end+'</summary><p class="subtle">中文脱敏概述：'+esc(c.summary_zh)+'</p><div class="reference">'+esc(c.quote||c.redaction)+'</div></details>').join("");html+='<details><summary>展开完整允许资料（服务器原始视图）</summary>'+(input.documents?.length?input.documents.map(d=>'<details><summary>'+esc(kinds[d.kind]||d.kind)+' · '+esc(d.title||d.id)+'</summary><blockquote>'+esc(d.text)+'</blockquote></details>').join(""):'<p class="subtle">公开版已省略完整病史；勾选左侧原始资料查看。</p>')+'</details>';return html;}
function render(){if(!input)return;$("privacy-note").textContent=$("private-view").checked?"当前为服务器原始视图，含临床原文；请勿用于公开截图。":"当前为脱敏投屏视图。中文概述与原文分别标注，公开省略不补写成原文。";$("case-title").textContent=input.title||"上传资料";const isDone=done.has(record?.status),isHistory=record?.source==="historical";$("badges").innerHTML='<span class="chip '+(isHistory?"":"green")+'">'+(isHistory?"历史真实回放":record?"本轮真实运行":"本轮尚未开始")+'</span><span class="chip">'+esc(record?.simulated===true?"模拟记录":catalog?.simulated===false?"真实后端":"待核验")+'</span><span class="chip">'+esc(record?.system||$("system-select").value)+'</span>';let q='<div class="eyebrow">同一问题 · 同一证据包</div><div class="question" style="margin-top:8px">'+esc(input.question_zh)+'</div><div class="small" style="margin-top:12px">'+esc(input.redaction||"原始资料可见；请仅在私密演示中使用")+'</div>';$("overview-question").innerHTML=q;$("overview-roles").innerHTML=roleCards(false);$("detail-roles").innerHTML=roleCards(true);$("overview-vote").innerHTML=voteHTML();$("overview-result").innerHTML=resultHTML(true)+'<div style="margin-top:18px">'+arbOverviewHTML()+'</div>';$("input-content").innerHTML=inputHTML();$("vote-content").innerHTML=voteHTML();$("arbitration-content").innerHTML=arbHTML();$("arbitration-refs").innerHTML='<h3>仲裁实际核对的来源</h3>'+((record?.vote?.arbitration?.triggered)?'<p class="subtle">引用编号：'+esc((record.vote.arbitration.evidence_ids||[]).join(" · "))+'</p>'+refsHTML(record?.arbitration_citations):'<p class="subtle">本记录没有仲裁原文核验步骤。</p>');$("result-content").innerHTML=resultHTML(false);$("result-refs").innerHTML='<h3>最终答案的原文引用</h3>'+refsHTML(record?.decision?.citations);const usage=record?.usage||eventList().filter(e=>e.kind==="model_usage").reduce((s,e)=>({calls:s.calls+1,input_tokens:s.input_tokens+(e.details.input_tokens||0),output_tokens:s.output_tokens+(e.details.output_tokens||0)}),{calls:0,input_tokens:0,output_tokens:0});$("audit-content").innerHTML='<div class="audit-grid"><div><b>'+usage.calls+'</b>实际调用</div><div><b>'+Number(usage.input_tokens).toLocaleString()+'</b>输入 token</div><div><b>'+Number(usage.output_tokens).toLocaleString()+'</b>输出 token</div><div><b>'+(record?.seconds?record.seconds.toFixed(1)+" s":"—")+'</b>病例耗时</div></div><pre>'+esc(JSON.stringify({run_id:record?.id,source:record?.source,status:record?.status,model_display:record?.model_display,model_id:record?.model_id,simulated:record?.simulated,code_commit:record?.code_commit,created_at:record?.created_at,fingerprint:record?.fingerprint,input_fingerprint:input.input_fingerprint,event_count:events.size,config:record?.config},null,2))+'</pre>';$("runtime-status").innerHTML='<span class="status-dot '+(!isDone&&record?"running":"")+'"></span>'+esc(record?.status||"未启动")+' · '+events.size+' 条去重事件';$("start-run").disabled=uploaded||(!isDone&&!!record&&!isHistory);$("start-run").textContent=$("source-select").value==="historical"?"发起本轮真实运行":record?"查看本轮任务":"发起真实运行";document.querySelectorAll("[data-role-ref]").forEach(b=>b.onclick=()=>showRoleCitations(b.dataset.roleRef));}
function showRoleCitations(role){const ballot=ballots().find(b=>b.role===role);$("citation-title").textContent=(roleNames[role]||role)+" · 实际引用";$("citation-body").innerHTML=refsHTML(ballot?.citations)+(ballot?.citations?.length?"":'<pre>'+esc((ballot?.evidence_ids||[]).join(" · "))+'</pre>');$("citation-dialog").showModal();}$("close-citations").onclick=()=>$("citation-dialog").close();
async function fetchEvents(id,myEpoch){let cursor=events.size?Math.max(...events.keys()):-1;for(;;){const batch=await api("/classroom/records/"+id+"/events?after="+cursor+"&private="+$("private-view").checked);if(myEpoch!==epoch)return;batch.forEach(e=>events.set(e.sequence,e));if(batch.length<500)break;cursor=Math.max(...events.keys());}}
async function loadRecord(id){const myEpoch=++epoch;clearTimeout(timer);events=new Map();record=null;uploaded=false;record=await api("/classroom/records/"+id+"?private="+$("private-view").checked);if(myEpoch!==epoch)return;input=record.input;await fetchEvents(id,myEpoch);render();localStorage.setItem("oncofusion-classroom",JSON.stringify({alias:record.case_alias,system:record.system,source:record.source,id}));if(!done.has(record.status))timer=setTimeout(()=>poll(id,myEpoch),1200);}
async function poll(id,myEpoch){try{const updated=await api("/classroom/records/"+id+"?private="+$("private-view").checked);if(myEpoch!==epoch)return;record=updated;input=updated.input;await fetchEvents(id,myEpoch);render();if(!done.has(record.status))timer=setTimeout(()=>poll(id,myEpoch),1500);else catalog=await api("/classroom/catalog");}catch(e){message("连接暂时中断："+e.message+"；刷新可重新查询。");}}
async function choose(){message("");uploaded=false;const alias=$("case-select").value,source=$("source-select").value;if(source==="historical")$("system-select").value="OncoFusion";$("system-select").disabled=source==="historical";const system=$("system-select").value;let found=catalog.records.find(r=>r.case_alias===alias&&r.source===source&&(source==="historical"||r.system===system));if(found)return loadRecord(found.id);++epoch;clearTimeout(timer);record=null;events=new Map();input=await api("/classroom/cases/"+alias+"?private="+$("private-view").checked);render();}
$("case-select").onchange=()=>choose().catch(e=>message(e.message));$("source-select").onchange=()=>choose().catch(e=>message(e.message));$("system-select").onchange=()=>choose().catch(e=>message(e.message));$("private-view").onchange=()=>choose().catch(e=>message(e.message));$("reload-record").onclick=async()=>{try{catalog=await api("/classroom/catalog");await choose();}catch(e){message(e.message);}};
$("start-run").onclick=async()=>{try{$("start-run").disabled=true;const response=await api("/classroom/runs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({case_alias:$("case-select").value,system:$("system-select").value})});$("source-select").value="new";catalog=await api("/classroom/catalog");await loadRecord(response.run_id);message("任务 "+response.run_id+" 已登记；所有内部调用共用全局20槽上限。");}catch(e){message(e.message);$("start-run").disabled=false;}};
$("upload-button").onclick=()=>$("upload").click();$("upload").onchange=async()=>{try{const file=$("upload").files[0];if(!file)return;const form=new FormData();form.append("file",file);const saved=await api("/cases/upload",{method:"POST",body:form});const c=await api("/cases/"+saved.case_ids[0]);const inspect=await api("/cases/inspect",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(c)});++epoch;clearTimeout(timer);record=null;events=new Map();uploaded=true;input={title:"上传资料 · 已检查",question_original:$("private-view").checked?c.question:null,question_zh:"上传资料通过现有 CaseInput 协议校验。",options:c.options,documents:$("private-view").checked?c.documents:[],excerpts:[],source_groups:[],redaction:"本轮六次固定演示不追加上传病例运行。",input_fingerprint:"由既有 /v1/cases/inspect 检查"};render();tab("input");message("已导入 "+saved.count+" 条；显示首条。检查结果："+JSON.stringify(inspect.task||c.task));}catch(e){message(e.message);}};
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>tab(b.dataset.view));
(async()=>{try{catalog=await api("/classroom/catalog");$("case-select").innerHTML=catalog.cases.map(c=>'<option value="'+c.alias+'">'+esc(c.alias.replace("case-","案例 "))+' · '+esc(c.title)+'</option>').join("");const saved=JSON.parse(localStorage.getItem("oncofusion-classroom")||"null");if(saved&&catalog.cases.some(c=>c.alias===saved.alias)){$("case-select").value=saved.alias;$("system-select").value=saved.system;$("source-select").value=saved.source;}await choose();}catch(e){message("后端尚未就绪："+e.message);}})();
</script></body></html>

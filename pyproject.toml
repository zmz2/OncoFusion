[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oncofusion"
version = "0.2.0"
description = "Reproducible multi-agent oncology evidence research backend"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "httpx>=0.27,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "langgraph==1.0.10"]

[project.optional-dependencies]
biomedical = ["tooluniverse==1.5.7"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "jsonschema>=4.23,<5"]

[project.scripts]
oncofusion = "oncofusion.cli:main"

[tool.setuptools]
license-files = ["third_party/*.LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
include = ["oncofusion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["oncofusion"]
branch = true

[tool.coverage.report]
show_missing = true
